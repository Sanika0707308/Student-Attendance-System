<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Dashboard</title>
    <link rel="stylesheet" href="css/style.css?v=3">
</head>

<body>

    <!-- SIDEBAR -->
    <app-sidebar></app-sidebar>

    <!-- MAIN CONTENT -->
    <div class="main">
        <h1 class="page-title">
            Dashboard 
            <span id="device-status-badge" style="font-size: 12px; margin-left: 15px; background: rgba(0,0,0,0.05); padding: 5px 12px; border-radius: 20px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px;">
                <span id="status-dot" class="status-dot offline"></span>
                <span id="status-text">Device Offline</span>
            </span>
        </h1>


        <!-- INFO CARDS -->
        <div class="cards">
            <div class="card">
                <p>Total Students</p>
                <h2 id="total">—</h2>
            </div>

            <div class="card present">
                <p>Present</p>
                <h2 id="present">—</h2>
            </div>

            <div class="card absent">
                <p>Absent</p>
                <h2 id="absent">—</h2>
            </div>
            
            <div class="card" style="border-left: 5px solid var(--warning);">
                <p>Emails Failed</p>
                <div style="display:flex; justify-content:space-between; align-items:flex-end;">
                    <div>
                        <h2 id="emails-failed">—</h2>
                        <span id="view-failed-emails" onclick="viewFailedEmails()" style="font-size: 12px; color: var(--primary); cursor: pointer; text-decoration: underline; display: none;">View List</span>
                    </div>
                    <button onclick="retryEmails()" id="btn-retry-emails" style="background-color:var(--warning); color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-weight:600; font-size:12px; display:none;">
                        Retry Sending
                    </button>
                </div>
            </div>
        </div>

        <!-- ATTENDANCE TABLE -->
        <div class="table-box">
            <div class="table-header">
                <h3>Attendance Records</h3>
                <div class="date-box">
                    <label for="attendance-date">Select Date:</label>
                    <input type="date" id="attendance-date" onchange="showDateRecords()">
                </div>
            </div>

            <table id="attendance-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Name</th>
                        <th>IN Time</th>
                        <th>OUT Time</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="5" style="text-align:center; color: var(--text-muted);">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- FAILED EMAILS MODAL -->
    <div id="failedEmailsModal" style="display:none; position:fixed; z-index:1001; left:0; top:0; width:100%; height:100%; background-color:rgba(0,0,0,0.5); align-items:center; justify-content:center;">
        <div style="background-color:white; padding:30px; border-radius:12px; width:90%; max-width:600px; max-height:80vh; overflow-y:auto; box-shadow:0 10px 25px rgba(0,0,0,0.2);">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h2 style="margin:0;">Failed Email Records</h2>
                <span onclick="closeFailedEmailsModal()" style="font-size:30px; cursor:pointer; color:#666;">&times;</span>
            </div>
            <div id="failed-emails-list">
                <table style="width:100%; border-collapse:collapse;">
                    <thead>
                        <tr style="text-align:left; border-bottom:2px solid #eee;">
                            <th style="padding:10px;">Student Name</th>
                            <th style="padding:10px;">Punch Time</th>
                            <th style="padding:10px;">Status</th>
                        </tr>
                    </thead>
                    <tbody id="failed-emails-body">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
            <div style="margin-top:25px; text-align:right;">
                <button onclick="closeFailedEmailsModal()" style="padding:10px 20px; background:#f1f5f9; border:none; border-radius:6px; cursor:pointer; font-weight:600;">Close</button>
            </div>
        </div>
    </div>

    <script src="js/sidebar.js?v=5"></script>
    <script src="js/dashboard.js?v=5"></script>
</body>

</html>
